[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "data-biz-copilot"
version = "0.1.0"
description = "Data Biz Copilot: dual-source logic & regulatory asset synthesizer and pure-business Q&A workbench"
requires-python = ">=3.9"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "SQLAlchemy>=2.0,<2.1",
  "pydantic-settings>=2.5,<3",
  "httpx>=0.27,<1",
  "python-multipart>=0.0.9,<1",
  "json-repair>=0.30,<1",
  "python-docx>=1.1,<2",
  "openpyxl>=3.1,<4",
  "sqlglot>=25,<31",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "requests>=2.32,<3",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]
